es:
  date:
    abbr_day_names: [dom, lun, mar, mié, jue, vie, sáb]
    abbr_month_names: [~, ene, feb, mar, abr, may, jun, jul, ago, sep, oct, nov, dic]
    day_names: [domingo, lunes, martes, miércoles, jueves, viernes, sábado]
    formats:
      default: "%d/%m/%Y"
      long: "%d de %B de %Y"
      short: "%d de %B"
    month_names: [~, enero, febrero, marzo, abril, mayo, junio, julio, agosto, septiembre, octubre, noviembre, diciembre]
    order:
      - :day
      - :month
      - :year

  errors:
    format: "%{attribute} %{message}"
    messages:
      accepted: "debe ser aceptado"
      blank: "no puede estar en blanco"
      confirmation: "no coincide con %{attribute}"
      empty: "no puede estar vacío"
      equal_to: "debe ser igual a %{count}"
      even: "debe ser par"
      exclusion: "está reservado"
      greater_than: "debe ser mayor que %{count}"
      greater_than_or_equal_to: "debe ser mayor o igual a %{count}"
      inclusion: "no está incluido en la lista"
      invalid: "no es válido"
      less_than: "debe ser menor que %{count}"
      less_than_or_equal_to: "debe ser menor o igual a %{count}"
      not_a_number: "no es un número"
      not_an_integer: "debe ser un entero"
      odd: "debe ser impar"
      other_than: "debe ser distinto de %{count}"
      present: "debe estar en blanco"
      required: "debe existir"
      taken: "ya está en uso"
      too_long:
        one: "es demasiado largo (1 carácter máximo)"
        other: "es demasiado largo (%{count} caracteres máximo)"
      too_short:
        one: "es demasiado corto (1 carácter mínimo)"
        other: "es demasiado corto (%{count} caracteres mínimo)"
      wrong_length:
        one: "no tiene la longitud correcta (1 carácter exactos)"
        other: "no tiene la longitud correcta (%{count} caracteres exactos)"
    template:
      body: "Hubo problemas con los siguientes campos:"
      header:
        one: "1 error impidió que este %{model} se guardara"
        other: "%{count} errores impidieron que este %{model} se guardara"

  helpers:
    select:
      prompt: "Por favor seleccione"
    submit:
      create: "Crear %{model}"
      submit: "Guardar %{model}"
      update: "Actualizar %{model}"

  number:
    currency:
      format:
        delimiter: "."
        format: "%u %n"
        precision: 0
        separator: ","
        unit: "$"
    format:
      delimiter: "."
      precision: 3
      separator: ","

  support:
    array:
      last_word_connector: " y "
      two_words_connector: " y "
      words_connector: ", "

  time:
    am: am
    formats:
      default: "%A, %d de %B de %Y a las %I:%M:%S %p"
      long: "%d de %B de %Y a las %H:%M"
      short: "%d de %b a las %H:%M"
    pm: pm

  activerecord:
    errors:
      messages:
        record_invalid: "La validación falló: %{errors}"
        restrict_dependent_destroy:
          has_one: "No se puede eliminar porque existe un %{record} dependiente"
          has_many: "No se puede eliminar porque existen %{record} dependientes"
    models:
      user:
        one: "Usuario"
        other: "Usuarios"
      category:
        one: "Categoría"
        other: "Categorías"
      product:
        one: "Producto"
        other: "Productos"
      customer:
        one: "Cliente"
        other: "Clientes"
    attributes:
      user:
        email: "Correo electrónico"
        password: "Contraseña"
        password_confirmation: "Confirmación de contraseña"
        name: "Nombre"
        role: "Rol"
        terminal_assigned: "Terminal asignada"
        active: "Activo"
      category:
        name: "Nombre"
        code: "Código"
        position: "Posición"
        active: "Activa"
      product:
        name: "Nombre"
        sku: "SKU"
        barcode: "Código de barras"
        category: "Categoría"
        cost: "Costo"
        price: "Precio"
        stock: "Stock"
        tax_rate: "IVA"
        pricing_mode: "Tipo de venta"
        active: "Activo"
      customer:
        name: "Nombre"
        document_type: "Tipo de documento"
        document_number: "Número de documento"
        phone: "Teléfono"
        address: "Dirección"
        credit_limit: "Cupo de crédito"
        credit_balance: "Saldo pendiente"
        active: "Activo"
