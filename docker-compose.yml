services:
  db:
    image: postgres:17-alpine
    container_name: resilios-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: resilios
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: resilios_pos_production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resilios"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: resilios-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_SERVE_STATIC_FILES: "true"
      DB_HOST: db
      DB_USERNAME: resilios
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
    volumes:
      - app_storage:/rails/storage
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: resilios-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  app_storage:
