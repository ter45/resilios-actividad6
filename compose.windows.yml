name: resilios
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: resilios
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD}
      POSTGRES_DB: resilios_pos_production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resilios -d resilios_pos_production"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      RAILS_SERVE_STATIC_FILES: "true"
      DB_HOST: db
      DB_USERNAME: resilios
      DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Configura SECRET_KEY_BASE}
      SOLID_QUEUE_IN_PUMA: "true"
    ports:
      - "127.0.0.1:${APP_PORT:-3021}:3000"
    volumes:
      - app_storage:/rails/storage
volumes:
  postgres_data:
  app_storage: